version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flakeguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./flakeguard.db
      - DEBUG=True
      - MODEL_DIR=/app/models
      - EXPERIMENT_DIR=/app/experiments
      - DATASET_DIR=/app/datasets
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./experiments:/app/experiments
      - ./datasets:/app/datasets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flakeguard-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  models:
  experiments:
  datasets:
